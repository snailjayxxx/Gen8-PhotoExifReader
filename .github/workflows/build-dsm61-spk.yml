name: Build DSM 6.1 SPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static bundled CPython 3.10 runtime
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf runtime /tmp/python-standalone
          mkdir -p /tmp/python-standalone

          # Baseline x86_64 + musl + static build: no host glibc/musl loader is required.
          URL='https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.10.20%2B20260718-x86_64-unknown-linux-musl-noopt%2Bstatic-full.tar.zst'
          curl -fL --retry 3 --retry-delay 2 -o /tmp/python-runtime.tar.zst "$URL"

          sudo apt-get update
          sudo apt-get install -y zstd
          tar --zstd -xf /tmp/python-runtime.tar.zst -C /tmp/python-standalone

          test -x /tmp/python-standalone/python/install/bin/python3
          mv /tmp/python-standalone/python/install runtime

          file runtime/bin/python3
          ldd runtime/bin/python3 || true
          PYTHONHOME="$PWD/runtime" PYTHONNOUSERSITE=1 runtime/bin/python3 --version
          PYTHONHOME="$PWD/runtime" PYTHONNOUSERSITE=1 runtime/bin/python3 - <<'PY'
          import http.server
          import json
          import os
          import sqlite3
          import subprocess
          import sys
          import threading
          conn = sqlite3.connect(':memory:')
          assert conn.execute('select 1').fetchone() == (1,)
          conn.close()
          print('runtime self-test:', sys.version, sqlite3.sqlite_version)
          PY

          # Keep the runtime conservative for this first NAS build. Remove only obvious
          # developer/demo material after the required stdlib modules have passed.
          rm -rf \
            runtime/lib/python3.10/test \
            runtime/lib/python3.10/idlelib \
            runtime/lib/python3.10/tkinter \
            runtime/lib/python3.10/turtledemo \
            runtime/lib/python3.10/ensurepip \
            runtime/share \
            runtime/include || true

          printf '%s\n' \
            'python-build-standalone 20260718' \
            'CPython 3.10.20' \
            'x86_64-unknown-linux-musl-noopt+static-full' > runtime/RUNTIME_SOURCE.txt

      - name: Restore DSM package icons
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > spk/PACKAGE_ICON.PNG
          printf '%s' '' | base64 -d > spk/PACKAGE_ICON_256.PNG
          file spk/PACKAGE_ICON.PNG spk/PACKAGE_ICON_256.PNG

      - name: Build SPK
        run: python3 scripts/build_spk_dsm61.py

      - name: Validate package and Python backend
        shell: bash
        run: |
          set -euxo pipefail
          SPK='dist/Gen8-PhotoExifReader-0.1.1-0004-DSM6.1-x86_64.spk'
          test -s "$SPK"
          rm -rf /tmp/spk-verify
          mkdir -p /tmp/spk-verify/root /tmp/spk-verify/payload /tmp/spk-verify/data
          tar -xf "$SPK" -C /tmp/spk-verify/root
          grep 'version="0.1.1-0004"' /tmp/spk-verify/root/INFO
          tar -xzf /tmp/spk-verify/root/package.tgz -C /tmp/spk-verify/payload
          test -x /tmp/spk-verify/payload/runtime/bin/python3
          test -x /tmp/spk-verify/payload/native/diag-server
          file /tmp/spk-verify/payload/runtime/bin/python3
          ldd /tmp/spk-verify/payload/runtime/bin/python3 || true
          PYTHONHOME=/tmp/spk-verify/payload/runtime PYTHONNOUSERSITE=1 /tmp/spk-verify/payload/runtime/bin/python3 -c 'import sqlite3, http.server; assert sqlite3.connect(":memory:").execute("select 1").fetchone() == (1,)'
          (
            cd /tmp/spk-verify/payload
            PHOTOEXIF_DATA_DIR=/tmp/spk-verify/data \
            PYTHONHOME=/tmp/spk-verify/payload/runtime \
            PYTHONNOUSERSITE=1 \
            PYTHONUNBUFFERED=1 \
            /tmp/spk-verify/payload/runtime/bin/python3 -m backend.app --host 127.0.0.1 --port 19865 \
              >/tmp/spk-verify/backend.log 2>&1 &
            echo $! >/tmp/spk-verify/backend.pid
          )
          sleep 2
          python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:19865/api/health', timeout=5) as r:
              data = json.load(r)
          assert data == {'ok': True, 'version': '0.1.1-0004', 'mode': 'python'}, data
          print(data)
          PY
          kill "$(cat /tmp/spk-verify/backend.pid)"
          sha256sum "$SPK" | tee dist/SHA256SUMS.txt
          ls -lh "$SPK"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen8-PhotoExifReader-0.1.1-0004
          path: |
            dist/Gen8-PhotoExifReader-0.1.1-0004-DSM6.1-x86_64.spk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
