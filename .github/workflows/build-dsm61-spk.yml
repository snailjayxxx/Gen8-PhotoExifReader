name: Build DSM 6.1 SPK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd build-essential
          docker --version

      - name: Prepare static bundled CPython 3.10 runtime
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf runtime /tmp/python-standalone
          mkdir -p /tmp/python-standalone
          URL='https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.10.20%2B20260718-x86_64-unknown-linux-musl-noopt%2Bstatic-full.tar.zst'
          curl -fL --retry 3 --retry-delay 2 -o /tmp/python-runtime.tar.zst "$URL"
          tar --zstd -xf /tmp/python-runtime.tar.zst -C /tmp/python-standalone
          test -x /tmp/python-standalone/python/install/bin/python3
          mv /tmp/python-standalone/python/install runtime
          file runtime/bin/python3
          ldd runtime/bin/python3 || true
          PYTHONHOME="$PWD/runtime" PYTHONNOUSERSITE=1 runtime/bin/python3 --version
          PYTHONHOME="$PWD/runtime" PYTHONNOUSERSITE=1 runtime/bin/python3 - <<'PY'
          import http.server, json, sqlite3, subprocess, sys, threading
          conn = sqlite3.connect(':memory:')
          assert conn.execute('select 1').fetchone() == (1,)
          conn.close()
          print('runtime self-test:', sys.version, sqlite3.sqlite_version)
          PY
          rm -rf runtime/lib/python3.10/test runtime/lib/python3.10/idlelib runtime/lib/python3.10/tkinter runtime/lib/python3.10/turtledemo runtime/lib/python3.10/ensurepip runtime/share runtime/include || true
          printf '%s\n' 'python-build-standalone 20260718' 'CPython 3.10.20' 'x86_64-unknown-linux-musl-noopt+static-full' > runtime/RUNTIME_SOURCE.txt

      - name: Prepare bundled Alpine Perl and ExifTool
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/prepare_exiftool_runtime.sh
          file vendor/perl/bin/perl
          file vendor/musl/ld-musl-x86_64.so.1
          vendor/exiftool/exiftool -ver

      - name: Generate DSM package icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, zlib
          from pathlib import Path
          def chunk(kind, data):
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) & 0xffffffff)
          def make(path, size):
              rows=[]
              cx=cy=(size-1)/2
              r=size*0.24
              for y in range(size):
                  row=bytearray([0])
                  for x in range(size):
                      d=((x-cx)**2+(y-cy)**2)**0.5
                      if d < r: rgba=(240,181,90,255)
                      elif d < r+max(1,size*0.018): rgba=(116,94,59,255)
                      else: rgba=(18,23,32,255)
                      row.extend(rgba)
                  rows.append(bytes(row))
              raw=b''.join(rows)
              png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',size,size,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              Path(path).write_bytes(png)
          make('spk/PACKAGE_ICON.PNG',72)
          make('spk/PACKAGE_ICON_256.PNG',256)
          PY
          file spk/PACKAGE_ICON.PNG spk/PACKAGE_ICON_256.PNG

      - name: Build SPK
        run: python3 scripts/build_spk_dsm61.py

      - name: Validate complete SPK and end-to-end scan
        shell: bash
        run: |
          set -euxo pipefail
          SPK='dist/Gen8-PhotoExifReader-0.1.1-0005-DSM6.1-x86_64.spk'
          test -s "$SPK"
          rm -rf /tmp/spk-verify
          mkdir -p /tmp/spk-verify/root /tmp/spk-verify/payload /tmp/spk-verify/data /tmp/spk-verify/library
          tar -xf "$SPK" -C /tmp/spk-verify/root
          grep 'version="0.1.1-0005"' /tmp/spk-verify/root/INFO
          tar -xzf /tmp/spk-verify/root/package.tgz -C /tmp/spk-verify/payload
          test -x /tmp/spk-verify/payload/runtime/bin/python3
          test -x /tmp/spk-verify/payload/vendor/perl/bin/perl
          test -e /tmp/spk-verify/payload/vendor/musl/ld-musl-x86_64.so.1
          test -x /tmp/spk-verify/payload/vendor/exiftool/exiftool
          test -x /tmp/spk-verify/payload/native/diag-server
          ldd /tmp/spk-verify/payload/runtime/bin/python3 || true
          /tmp/spk-verify/payload/vendor/exiftool/exiftool -ver | grep -q '13.55'

          printf '\377\330\377\331' > /tmp/spk-verify/library/test.jpg
          cat > /tmp/spk-verify/data/config.json <<JSON
          {
            "libraries": [{"name": "CI", "path": "/tmp/spk-verify/library", "enabled": true}],
            "raw_extensions": [".arw", ".cr2", ".cr3", ".nef", ".nrw", ".raf", ".orf", ".rw2", ".dng", ".pef", ".srw"],
            "image_extensions": [".jpg", ".jpeg", ".heic", ".heif", ".tif", ".tiff"],
            "edited_dir_keywords": ["修图", "edited"],
            "jpeg_dir_keywords": ["jpg", "jpeg", "直出"],
            "raw_dir_keywords": ["raw", "原片"],
            "edited_filename_suffixes": ["-edit", "_edit", "-修图", "_修图"],
            "scan_batch_size": 64
          }
          JSON

          (
            cd /tmp/spk-verify/payload
            PHOTOEXIF_DATA_DIR=/tmp/spk-verify/data PYTHONHOME=/tmp/spk-verify/payload/runtime PYTHONNOUSERSITE=1 PYTHONUNBUFFERED=1 \
              /tmp/spk-verify/payload/runtime/bin/python3 -m backend.app --host 127.0.0.1 --port 19865 >/tmp/spk-verify/backend.log 2>&1 &
            echo $! >/tmp/spk-verify/backend.pid
          )
          sleep 2
          python3 - <<'PY'
          import json, time, urllib.request
          def get(path):
              with urllib.request.urlopen('http://127.0.0.1:19865'+path, timeout=10) as r:
                  return json.load(r)
          def post(path):
              req=urllib.request.Request('http://127.0.0.1:19865'+path,data=b'{}',headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=10) as r:
                  return json.load(r)
          health=get('/api/health')
          assert health == {'ok': True, 'version': '0.1.1-0005', 'mode': 'python'}, health
          runtime=get('/api/runtime')
          assert runtime['exiftool']['ok'] is True, runtime
          assert runtime['exiftool']['version'] == '13.55', runtime
          post('/api/scan')
          for _ in range(30):
              state=get('/api/scan/status')
              if not state['running']:
                  break
              time.sleep(.2)
          else:
              raise AssertionError('scan did not finish')
          lib=state['last_result']['libraries'][0]
          assert lib['recursive'] is True, lib
          assert lib['discovered'] == 1, lib
          assert lib['indexed'] == 1, lib
          assert lib['errors'] == 0, lib
          dash=get('/api/dashboard')
          assert dash['file_count'] == 1, dash
          print('health:', health)
          print('runtime:', runtime)
          print('scan:', lib)
          PY
          kill "$(cat /tmp/spk-verify/backend.pid)"
          sha256sum "$SPK" | tee dist/SHA256SUMS.txt
          ls -lh "$SPK"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gen8-PhotoExifReader-0.1.1-0005
          path: |
            dist/Gen8-PhotoExifReader-0.1.1-0005-DSM6.1-x86_64.spk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
